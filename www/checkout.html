<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="icons/icon_192x192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-extra.css">
</head>
<body>
<div class="page-root" id="pageRoot">
<header>
 <h1>
        <a href="index.html" class="logo">FoodRush</a>
    </h1>
    <button id="themeToggle" class="theme-toggle" aria-label="Theme toggle">
  <!-- Sun -->
  <svg id="sunIcon" viewBox="0 0 24 24" width="22" height="22">
    <path d="M12 4V2m0 20v-2m8-8h2M2 12H4m14.95 6.95l1.41 1.41M5.64 5.64l1.41 1.41m12.9-1.41l-1.41 1.41M5.64 18.36l-1.41 1.41M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8z"/>
  </svg>
  <!-- Moon -->
  <svg id="moonIcon" viewBox="0 0 24 24" width="22" height="22">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  </svg>
</button>
    <nav>
      <div class="address-box" onclick="openAddressModal()">
           <span class="address-label">Παράδοση σε:</span>
          <span id="active-address">—</span>
          </div>
         <a href="stores.html"><img src="store_12671935.png" alt="Καταστήματα" class="icon"></a>
            <a href="cart.html" class="cart-icon"> 
            <img src="shopping-cart_17216306.png" alt="Καλάθι" class="icon"><span id="cart-count">0</span></a>
            <a href="login.html" title="Σύνδεση">
            <img src="man_14506340.png" alt="Σύνδεση" class="icon"></a>
    </nav>
</header>

<main class="checkout-page">

  <h2>Ολοκλήρωση Παραγγελίας</h2>

  <!-- 1️⃣ Σύνοψη -->
  <section class="checkout-card">
    <h3>Η παραγγελία σου</h3>

    <!-- 🔧 ΑΥΤΟ θα γεμίζει από JS -->
    <div class="checkout-items"></div>

    <hr>

    <div class="checkout-total">
      <span>Σύνολο</span>
      <!-- 🔧 ID για JS -->
      <strong id="checkout-total">0,00€</strong>
    </div>
  </section>

  <!-- 2️⃣ Διεύθυνση -->
  <section class="checkout-card">
    <h3>Διεύθυνση Παράδοσης</h3>

    <!-- 🔧 μπορείς μετά να το γεμίσεις από localStorage -->
    <p class="address-preview" id="checkout-address">
      Χολωμώντος 12, Άνω Τούμπα<br>
      Όροφος 2, Κουδούνι Παπαδόπουλος
    </p>

    <button class="secondary-btn" type="button" onclick="openAddressModal()">
      Αλλαγή διεύθυνσης
    </button>
  </section>

  <!-- 3️⃣ Πληρωμή -->
  <section class="checkout-card">
  <h3>Τρόπος Πληρωμής</h3>

  <div class="payment-methods">
     <button class="pay-method active" data-method="cod">
    <span class="dot"></span>
    <span class="label">Μετρητά κατά την παράδοση</span>
  </button>
    <button class="pay-method" data-method="card">
    <span class="dot"></span>
    <span class="label">Πληρωμή με κάρτα</span>
  </button>
  </div>

  <!-- Fake Card Gateway -->
  <div class="card-form" id="cardForm" style="display:none;">
    <input type="text" id="cardNumber" placeholder="Αριθμός κάρτας">
    <input type="text" id="cardName" placeholder="Όνομα κατόχου">
    <div class="card-row">
      <input type="text" id="cardExpiry" placeholder="MM/YY">
      <input type="text" id="cardCvv" placeholder="CVV">
    </div>
  </div>
</section>

  <!-- 4️⃣ Σχόλια -->
  <section class="checkout-card">
    <h3>Σχόλια παραγγελίας</h3>
    <!-- 🔧 ID για JS -->
    <textarea id="order-notes"
      placeholder="π.χ. χωρίς κρεμμύδι, χτύπα κουδούνι"></textarea>
  </section>

  <!-- 5️⃣ Ολοκλήρωση -->
  <button
    class="primary-btn checkout-submit"
    onclick="submitOrder()">
    Ολοκλήρωση Παραγγελίας
  </button>

</main>
</div>
 <!-- Footer -->

      <div class="footer-links">
        <a href="terms-&-conditions.html">Όροι & Προϋποθέσεις</a>
        <a href="privacy.html">Πολιτική Απορρήτου</a>
        <a href="cookies.html">Cookies</a>
        <a href="contact.html">Επικοινωνία</a>
      </div>
      <div class="footer-copy">
        © 2026 FoodRush. All rights reserved.
      </div>
    </div>

    <div class="footer-right">
      <div class="footer-socials">
    <a href="https://instagram.com" target="_blank" rel="noopener">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
       xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
    <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor"/>
  </svg></a>
    <a href="https://facebook.com" target="_blank" rel="noopener">      
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
       xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"
          stroke="currentColor" stroke-width="2"/>
    <path d="M14 9h-2V7.5c0-.8.5-1 1-1h1V4h-2
             c-2 0-3 1.3-3 3.2V9H7v3h2v8h3v-8h2.1L14 9z"
          fill="currentColor"/>
         </svg>
        </a>
      </div>
    </div>
  </div>
</footer>

<script src="checkout.js"></script>
<script src="app.js"></script>
<script src="back.js" type="module"></script>

</body>
</html>

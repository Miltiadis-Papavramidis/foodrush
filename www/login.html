<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>FoodRush | Εγγραφή / Σύνδεση</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icons/icon_192x192.png">
</head>
<body data-page="login">


<section class="login-section">

    <h2 id="formTitle">Εγγραφή</h2>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="login-form">
        <input type="text" id="regUsername" placeholder="Όνομα χρήστη" required>
        <input type="email" id="regEmail" placeholder="Email" required>
        <div class="password-wrapper">
  <input type="password" id="regPassword" placeholder="Κωδικός" required>
  <span class="toggle-password" onclick="togglePassword('regPassword', this)">👁️</span>
</div>
        <button type="submit">Εγγραφή</button>
    </form>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="login-form hidden">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <div class="password-wrapper">
  <input type="password" id="loginPassword" placeholder="Κωδικός" required>
  <span class="toggle-password" onclick="togglePassword('loginPassword', this)">👁️</span>
</div>
        <button type="submit">Σύνδεση</button>
    </form>

    <!-- Toggle Button -->
    <button id="toggleBtn" class="toggle-btn">Ή κάνε Σύνδεση</button>

<button id="homeBtn" class="toggle-btn">Αρχική</button>

    <p id="loginMessage"></p>
</section>

  <!-- Footer -->
    <footer class="footer">
  <div class="footer-content">
    <div class="footer-center-group">
      <div class="footer-links">
        <a href="terms.html">Όροι & Προϋποθέσεις</a>
        <a href="privacy.html">Πολιτική Απορρήτου</a>
        <a href="cookies.html">Cookies</a>
        <a href="contact.html">Επικοινωνία</a>
      </div>

      <div class="footer-copy">
        © 2026 FoodRush. All rights reserved.
      </div>
    </div>

    <div class="footer-right">
      <div class="footer-socials">
    <a href="https://instagram.com" target="_blank" rel="noopener">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
       xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
    <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor"/>

          fill="currentColor"/>
         </svg>

  </div>
</footer>

<script src="login.js"></script>

</body>
